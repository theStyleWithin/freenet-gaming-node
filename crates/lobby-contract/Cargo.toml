[package]
name = "lobby-contract"
description = "Freenet contract: signed, expiring game-lobby announcements (skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib -> the WASM contract; rlib -> lets `cargo test` link it natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
lobby-types = { path = "../lobby-types" }
freenet-stdlib.workspace = true
serde_json.workspace = true

[features]
default = ["contract", "freenet-main-contract"]
freenet-main-contract = []
contract = ["freenet-stdlib/contract"]
